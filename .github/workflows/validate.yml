name: Validate publication

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Rebuild publication artifacts
        run: python rebuild.py

      - name: Run data and editorial tests
        run: python -m unittest discover -s tests -v

      - name: Run freeze-readiness checks
        run: python scripts/verify_freeze_readiness.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Check JavaScript syntax
        run: npm run check:js
        # Covers frontend/js/scenes/scene_waves.js and the other story modules.

      - name: Run JavaScript unit tests
        run: npm run test:js

      - name: Build frontend bundles
        run: |
          npm ci
          npm run build
          npm run check:budget
          npm run check:contracts
          git diff --exit-code -- frontend/index.html frontend/vol1_time.html frontend/vol2_geo.html frontend/vol3_lang.html frontend/vol4_memory.html frontend/build

      - name: Confirm deterministic rebuild
        run: git diff --exit-code
